name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt pip-audit detect-secrets bandit
      - name: Compile Python sources
        run: python -m compileall -q app scripts tests
      - name: Run test suite
        run: python -m pytest -q
      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt
      - name: Scan source for secrets
        run: |
          detect-secrets scan --all-files app scripts tests .env.example README.md README_EN.md SECURITY.md > /tmp/detect-secrets.json
          python - <<'PY'
          import json

          with open("/tmp/detect-secrets.json", encoding="utf-8") as handle:
              report = json.load(handle)
          findings = sum(len(items) for items in report["results"].values())
          if findings:
              raise SystemExit(f"detect-secrets found {findings} unresolved result(s)")
          PY
      - name: Run high-severity static security checks
        run: bandit -q -lll -r app scripts
      - name: Verify public preview assets
        run: |
          python - <<'PY'
          import struct
          from pathlib import Path

          social = Path("docs/images/social-preview.png")
          dashboard = Path("docs/images/dashboard.png")
          def png_size(path):
              data = path.read_bytes()
              assert data.startswith(b"\x89PNG\r\n\x1a\n")
              assert data[12:16] == b"IHDR"
              return struct.unpack(">II", data[16:24])

          assert png_size(social) == (1280, 640)
          assert png_size(dashboard)[0] >= 1280
          assert social.stat().st_size < 1_000_000
          assert Path("app/static/favicon.ico").stat().st_size > 1024
          PY
