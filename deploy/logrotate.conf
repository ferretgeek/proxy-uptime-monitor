/var/log/airport-monitor/*.log {
    daily
    maxsize 25M
    rotate 40
    maxage 45
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su airportmon airportmon
    create 0600 airportmon airportmon
    postrotate
        /usr/bin/python3 /usr/local/lib/airport-monitor/storage_guard.py >/dev/null 2>&1 || true
    endscript
}
